<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Periodic Table & Electron Configuration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Arial', 'Helvetica', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
        }

        /* Periodic Table Grid */
        .pt-grid {
            display: grid;
            grid-template-columns: repeat(18, minmax(0, 1fr));
            gap: 1px;
            margin-bottom: 0.5rem;
            min-width: 550px; /* 작아진 주기율표 최소 너비 */
        }

        .element-cell {
            aspect-ratio: 1 / 1.1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 0.6rem;
            border: 1px solid #d1d5db;
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.1s;
            background-color: white;
            user-select: none;
            padding: 1px;
        }

        .element-cell:hover {
            transform: scale(1.15);
            z-index: 10;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .element-cell.active {
            border-color: #000;
            border-width: 2px;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.8);
            transform: scale(1.15);
            z-index: 10;
        }

        /* Block Colors */
        .block-s { background-color: #fecaca; } 
        .block-p { background-color: #bbf7d0; } 
        .block-d { background-color: #bfdbfe; } 
        .block-f { background-color: #e9d5ff; } 
        
        /* Orbital Boxes */
        .orbital-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .box-container {
            display: flex;
            gap: 2px;
        }

        .box {
            width: 22px;
            height: 22px;
            border: 1px solid #9ca3af;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
        }

        .box.filled {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }

        /* Electrons */
        .electron-up {
            width: 7px;
            height: 15px;
            stroke: #ef4444;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .electron-down {
            width: 7px;
            height: 15px;
            stroke: #3b82f6;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            margin-left: 1px;
        }

        .orbital-label {
            font-family: 'Times New Roman', Times, serif;
            font-style: italic;
            font-weight: bold;
            color: #4b5563;
            font-size: 0.75rem;
        }
    </style>
</head>
<body class="p-2">

    <!-- 크기 축소: max-w-7xl -> max-w-4xl, 패딩 축소 -->
    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-lg p-3 md:p-5 flex flex-col gap-4">
        
        <!-- Header -->
        <div class="border-b pb-2">
            <h1 class="text-xl font-bold mb-1">모든 원소의 전자 배치</h1>
            <p class="text-gray-600 text-xs">
                원소를 클릭하거나 +/- 버튼을 눌러 전자 배치를 확인하세요. 예외적 전자 배치(Cr, Cu 등)가 모두 반영되어 있습니다.
            </p>
        </div>

        <!-- Periodic Table (스크롤 가능하도록 overflow-x-auto 추가) -->
        <div class="bg-gray-50 rounded-lg p-2 border overflow-x-auto">
            <div id="periodic-table" class="pt-grid">
                <!-- Generated by JS -->
            </div>
            <!-- Legend -->
            <div class="flex justify-center gap-4 mt-1 text-[10px] font-bold text-gray-600">
                <div class="flex items-center gap-1"><div class="w-2.5 h-2.5 block-s border border-gray-400"></div> s-block</div>
                <div class="flex items-center gap-1"><div class="w-2.5 h-2.5 block-p border border-gray-400"></div> p-block</div>
                <div class="flex items-center gap-1"><div class="w-2.5 h-2.5 block-d border border-gray-400"></div> d-block</div>
                <div class="flex items-center gap-1"><div class="w-2.5 h-2.5 block-f border border-gray-400"></div> f-block</div>
            </div>
        </div>

        <!-- Selected Element Info with +/- Buttons -->
        <div class="flex flex-row gap-4 items-center bg-blue-50 p-3 md:p-4 rounded-lg border border-blue-200">
            <div class="flex items-center justify-center gap-2">
                <button id="btn-prev" onclick="changeZ(-1)" class="w-8 h-8 shrink-0 flex items-center justify-center bg-white border border-gray-300 text-gray-700 rounded-full shadow hover:bg-gray-100 disabled:opacity-30 transition font-bold text-lg" title="전자 감소 (−)">−</button>
                
                <div class="flex items-center justify-center w-16 h-16 shrink-0 bg-white rounded-lg shadow border-2 border-blue-400 flex-col relative">
                    <span class="absolute top-1 left-1.5 text-gray-500 font-bold text-[10px]" id="info-z">6</span>
                    <span class="text-2xl font-bold text-gray-800 leading-none mt-1" id="info-sym">C</span>
                    <span class="text-[10px] font-bold text-gray-600 mt-0.5" id="info-name">탄소</span>
                </div>

                <button id="btn-next" onclick="changeZ(1)" class="w-8 h-8 shrink-0 flex items-center justify-center bg-blue-600 text-white rounded-full shadow hover:bg-blue-700 disabled:opacity-30 transition font-bold text-lg" title="전자 증가 (+)">+</button>
            </div>
            
            <div class="flex flex-col gap-1 flex-grow text-left">
                <h3 class="text-xs font-bold text-blue-800 uppercase tracking-wide">전자 배치</h3>
                <div class="text-lg md:text-xl font-mono font-bold text-gray-800 tracking-wide break-words leading-tight" id="info-config">
                    1s² 2s² 2p²
                </div>
                <div class="text-sm font-mono text-gray-600 font-semibold leading-tight" id="info-core-config">
                    [He] 2s² 2p²
                </div>
            </div>
        </div>

        <!-- Orbital Diagram Area -->
        <div class="bg-white border rounded-lg p-4 flex flex-col items-center">
            <h3 class="text-sm font-bold mb-3 text-gray-700 w-full text-left">오비탈 에너지 도표</h3>
            
            <div class="flex flex-wrap gap-2 md:gap-3 items-end justify-start min-w-full min-h-[60px] pb-1" id="orbital-diagram">
                <!-- Generated by JS -->
            </div>
            
            <div class="w-full mt-4 relative">
                <div class="h-0.5 bg-gradient-to-r from-gray-300 to-yellow-500 w-full relative">
                    <div class="absolute -right-1 -top-1 w-0 h-0 border-t-[3px] border-b-[3px] border-l-[6px] border-t-transparent border-b-transparent border-l-yellow-500"></div>
                </div>
                <div class="text-right text-[10px] text-yellow-600 font-bold mt-1 font-serif italic">Energy (E) 증가 방향</div>
            </div>
        </div>

    </div>

    <script>
        // Data Initialization
        const syms = "H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Kr Rb Sr Y Zr Nb Mo Tc Ru Rh Pd Ag Cd In Sn Sb Te I Xe Cs Ba La Ce Pr Nd Pm Sm Eu Gd Tb Dy Ho Er Tm Yb Lu Hf Ta W Re Os Ir Pt Au Hg Tl Pb Bi Po At Rn Fr Ra Ac Th Pa U Np Pu Am Cm Bk Cf Es Fm Md No Lr Rf Db Sg Bh Hs Mt Ds Rg Cn Nh Fl Mc Lv Ts Og".split(" ");
        const namesK = "수소 헬륨 리튬 베릴륨 붕소 탄소 질소 산소 플루오린 네온 소듐 마그네슘 알루미늄 규소 인 황 염소 아르곤 포타슘 칼슘 스칸듐 타이타늄 바나듐 크로뮴 망가니즈 철 코발트 니켈 구리 아연 갈륨 저마늄 비소 셀레늄 브로민 크립톤 루비듐 스트론튬 이트륨 지르코늄 나이오븀 몰리브데넘 테크네튬 루테늄 로듐 팔라듐 은 카드뮴 인듐 주석 안티모니 텔루륨 아이오딘 제논 세슘 바륨 란타넘 세륨 프라세오디뮴 네오디뮴 프로메튬 사마륨 유로퓸 가돌리늄 터븀 디스프로슘 홀뮴 어븀 툴륨 이터븀 루테튬 하프늄 탄탈럼 텅스텐 레늄 오스뮴 이리듐 백금 금 수은 탈륨 납 비스무트 폴로늄 아스타틴 라돈 프랑슘 라듐 악티늄 토륨 프로탁티늄 우라늄 넵투늄 플루토늄 아메리슘 퀴륨 버클륨 캘리포늄 아인슈타이늄 페르뮴 멘델레븀 노벨륨 로렌슘 러더포듐 더브늄 시보귬 보륨 하슘 마이트너륨 다름슈타튬 뢴트게늄 코페르니슘 니호늄 플레로븀 모스코븀 리버모륨 테네신 오가네손".split(" ");
        
        // Standard Aufbau Order & Capacities
        const aufbauOrder = ['1s','2s','2p','3s','3p','4s','3d','4p','5s','4d','5p','6s','4f','5d','6p','7s','5f','6d','7p'];
        const capacities = { 's': 2, 'p': 6, 'd': 10, 'f': 14 };
        const nobleGases = [ {z:2, sym:'He'}, {z:10, sym:'Ne'}, {z:18, sym:'Ar'}, {z:36, sym:'Kr'}, {z:54, sym:'Xe'}, {z:86, sym:'Rn'}, {z:118, sym:'Og'} ];

        // Exceptions to Madelung rule
        const exceptions = {
            24: {'4s':1, '3d':5}, 29: {'4s':1, '3d':10},
            41: {'5s':1, '4d':4}, 42: {'5s':1, '4d':5}, 44: {'5s':1, '4d':7}, 45: {'5s':1, '4d':8}, 46: {'5s':0, '4d':10}, 47: {'5s':1, '4d':10},
            57: {'6s':2, '5d':1, '4f':0}, 58: {'6s':2, '4f':1, '5d':1}, 64: {'6s':2, '4f':7, '5d':1},
            78: {'6s':1, '5d':9}, 79: {'6s':1, '5d':10},
            89: {'7s':2, '6d':1, '5f':0}, 90: {'7s':2, '6d':2, '5f':0}, 91: {'7s':2, '5f':2, '6d':1}, 92: {'7s':2, '5f':3, '6d':1}, 93: {'7s':2, '5f':4, '6d':1}, 96: {'7s':2, '5f':7, '6d':1}, 103: {'7s':2, '5f':14, '6d':1}
        };

        const svgUp = `<svg class="electron-up" viewBox="0 0 10 30"><path d="M 5,28 L 5,2 L 9,6"/></svg>`;
        const svgDown = `<svg class="electron-down" viewBox="0 0 10 30"><path d="M 5,2 L 5,28 L 1,24"/></svg>`;
        let currentZ = 6;

        function getBlock(orb) { return orb.slice(-1); }

        function calculateConfiguration(z) {
            let config = {};
            let remaining = z;

            for (let orb of aufbauOrder) {
                if (remaining <= 0) break;
                let cap = capacities[getBlock(orb)];
                let fill = Math.min(remaining, cap);
                config[orb] = fill;
                remaining -= fill;
            }

            if (exceptions[z]) {
                let ex = exceptions[z];
                for(let orb in ex) { config[orb] = 0; }
                for(let orb in ex) { config[orb] = ex[orb]; }
            }

            for(let key in config) { if(config[key] === 0) delete config[key]; }
            return config;
        }

        function formatConfig(config) {
            const supers = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
            let str = '';
            for (let orb of aufbauOrder) {
                if (config[orb]) {
                    let numStr = config[orb].toString().split('').map(c => supers[c]||c).join('');
                    str += `${orb}${numStr} `;
                }
            }
            return str.trim();
        }

        function getCoreConfig(z, config) {
            if (z <= 2) return formatConfig(config);
            let coreGas = nobleGases[0];
            for(let i=nobleGases.length-1; i>=0; i--) {
                if (nobleGases[i].z < z) {
                    coreGas = nobleGases[i];
                    break;
                }
            }
            
            let coreConfigObj = calculateConfiguration(coreGas.z);
            let valConfig = {};
            
            for (let orb of aufbauOrder) {
                if (config[orb]) {
                    if (!coreConfigObj[orb] || config[orb] > coreConfigObj[orb]) {
                        valConfig[orb] = config[orb] - (coreConfigObj[orb] || 0);
                    }
                }
            }
            return `[${coreGas.sym}] ` + formatConfig(valConfig);
        }

        // Draw Periodic Table
        function buildPeriodicTable() {
            const pt = document.getElementById('periodic-table');
            
            for (let row = 1; row <= 10; row++) {
                for (let col = 1; col <= 18; col++) {
                    let z = 0;
                    if(row===1) { if(col===1) z=1; if(col===18) z=2; }
                    else if(row===2) { if(col<=2) z=col+2; if(col>=13) z=col-8; }
                    else if(row===3) { if(col<=2) z=col+10; if(col>=13) z=col; }
                    else if(row===4) { z = col+18; }
                    else if(row===5) { z = col+36; }
                    else if(row===6) { 
                        if(col<=2) z = col+54; 
                        else if(col===3) z = -1; 
                        else z = col+68;
                    }
                    else if(row===7) { 
                        if(col<=2) z = col+86; 
                        else if(col===3) z = -2; 
                        else z = col+100;
                    }
                    else if(row===8) {} 
                    else if(row===9) { if(col>=4 && col<=18) z = col+53; } 
                    else if(row===10) { if(col>=4 && col<=18) z = col+85; } 

                    let cell = document.createElement('div');
                    
                    if (z > 0 && z <= 118) {
                        let block = 'd';
                        if (col<=2 || (row===1 && col===18)) block = 's';
                        else if (col>=13 && row<=7) block = 'p';
                        else if (row>=9) block = 'f';

                        cell.className = `element-cell block-${block}`;
                        cell.id = `cell-${z}`;
                        cell.onclick = () => selectElement(z);
                        cell.innerHTML = `
                            <span class="opacity-50" style="font-size:0.5rem; line-height:1;">${z}</span>
                            <span class="font-bold text-gray-800" style="font-size:0.7rem; line-height:1;">${syms[z-1]}</span>
                        `;
                    } else if (z === -1) {
                        cell.className = `element-cell block-f opacity-50`;
                        cell.innerHTML = `<span style="font-size:0.45rem;">57-71</span>`;
                    } else if (z === -2) {
                        cell.className = `element-cell block-f opacity-50`;
                        cell.innerHTML = `<span style="font-size:0.45rem;">89-103</span>`;
                    }
                    
                    cell.style.gridRow = row;
                    cell.style.gridColumn = col;
                    pt.appendChild(cell);
                }
            }
        }

        function drawOrbitalDiagram(config) {
            const container = document.getElementById('orbital-diagram');
            container.innerHTML = '';

            for (let orb of aufbauOrder) {
                if (!config[orb]) continue;
                
                let eCount = config[orb];
                let block = getBlock(orb);
                let numBoxes = capacities[block] / 2;
                
                let group = document.createElement('div');
                group.className = 'orbital-group';
                
                let label = document.createElement('span');
                label.className = 'orbital-label';
                label.innerText = orb;
                group.appendChild(label);

                let boxCont = document.createElement('div');
                boxCont.className = 'box-container flex-wrap justify-center';

                // Hund's Rule Distribution
                let boxesArr = Array.from({length: numBoxes}, () => []);
                for(let i=0; i<eCount; i++) {
                    if (i < numBoxes) boxesArr[i].push('up');
                    else boxesArr[i % numBoxes].push('down');
                }

                for(let i=0; i<numBoxes; i++) {
                    let box = document.createElement('div');
                    box.className = 'box shrink-0'; 
                    if (boxesArr[i].length > 0) {
                        box.classList.add('filled');
                        if (boxesArr[i].includes('up')) box.innerHTML += svgUp;
                        if (boxesArr[i].includes('down')) box.innerHTML += svgDown;
                    }
                    boxCont.appendChild(box);
                }
                
                group.appendChild(boxCont);
                container.appendChild(group);
            }
        }

        function changeZ(delta) {
            let nextZ = currentZ + delta;
            if (nextZ >= 1 && nextZ <= 118) {
                selectElement(nextZ);
            }
        }

        function selectElement(z) {
            // Null 에러 방지를 위한 안전한 요소 선택
            document.querySelectorAll('.element-cell').forEach(c => c.classList.remove('active'));
            const activeCell = document.getElementById(`cell-${z}`);
            if (activeCell) {
                activeCell.classList.add('active');
            }

            currentZ = z;
            
            // Toggle Button States
            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');
            if (btnPrev) btnPrev.disabled = (z <= 1);
            if (btnNext) btnNext.disabled = (z >= 118);

            // Update Info
            document.getElementById('info-z').innerText = z;
            document.getElementById('info-sym').innerText = syms[z-1];
            document.getElementById('info-name').innerText = namesK[z-1];

            const config = calculateConfiguration(z);
            document.getElementById('info-config').innerText = formatConfig(config);
            document.getElementById('info-core-config').innerText = getCoreConfig(z, config);

            drawOrbitalDiagram(config);
        }

        function init() {
            buildPeriodicTable();
            selectElement(currentZ); 
        }

        window.onload = init;
    </script>
</body>
</html>
