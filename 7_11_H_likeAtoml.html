<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hydrogenic Atom Model & Effective Nuclear Charge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MathJax for high-quality math rendering -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            overflow-x: hidden;
        }
        .canvas-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
        }
        canvas {
            width: 100%;
            height: 100%;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* Style for dynamic math symbols to match MathJax look */
        .math-symbol {
            font-family: "Times New Roman", Times, serif;
            font-style: italic;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold mb-2">유효 핵전하 및 가려막기 효과 시각화</h1>
            <p class="text-slate-400">원자 번호에 따른 전자 껍질 변화와 최외각 전자가 느끼는 핵전하를 관찰하세요.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Control Panel -->
            <div class="glass-panel p-6 rounded-2xl flex flex-col gap-6">
                <div>
                    <label class="block text-sm font-medium mb-4">
                        원소 선택 (Atomic Number <span class="math-symbol text-blue-400 text-lg">Z</span>)
                    </label>
                    <input type="range" id="z-slider" min="1" max="20" value="11" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500">
                    <div class="flex justify-between mt-2 text-xl font-bold text-blue-400">
                        <span id="element-symbol">Na</span>
                        <span id="z-display"><span class="math-symbol">Z</span> = 11</span>
                    </div>
                </div>

                <div class="space-y-4 border-t border-slate-700 pt-4">
                    <div class="flex justify-between">
                        <span>전체 전자 수</span>
                        <span id="total-electrons" class="font-mono text-blue-300">11</span>
                    </div>
                    <div class="flex justify-between">
                        <span>안쪽 껍질 전자 (<span class="math-symbol">S</span>)</span>
                        <span id="core-electrons" class="font-mono text-orange-400">10</span>
                    </div>
                    <div class="flex justify-between font-bold text-lg border-t border-slate-700 pt-2 text-green-400">
                        <span>유효 핵전하 (<span class="math-symbol">Z<sub>eff</sub></span>)</span>
                        <span id="z-eff-display">~1.00</span>
                    </div>
                </div>

                <div class="bg-slate-800/50 p-4 rounded-xl text-sm border border-slate-600/30">
                    <p class="mb-3 font-bold text-slate-300 italic flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-400"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                        Concept Formula:
                    </p>
                    <div class="text-center bg-slate-900/50 py-3 rounded mb-3">
                        <!-- Static MathJax rendering -->
                        $Z_{eff} = Z - S$
                    </div>
                    <p class="text-slate-400 text-xs leading-relaxed">
                        핵전하($Z$)에서 안쪽 전자들의 가려막기 상수($S$)를 뺀 값이 실제 최외각 전자가 느끼는 전하입니다.
                    </p>
                </div>
            </div>

            <!-- Visualization Canvas -->
            <div class="lg:col-span-2 glass-panel p-4 rounded-2xl flex items-center justify-center min-h-[400px]">
                <div class="canvas-container" id="container">
                    <canvas id="atomCanvas"></canvas>
                </div>
            </div>
        </div>

        <footer class="mt-8 text-center text-slate-500 text-sm">
            <p>일반화학 교육용 인터랙티브 모듈 - 원자 구조와 주기성</p>
        </footer>
    </div>

    <script>
        const canvas = document.getElementById('atomCanvas');
        const ctx = canvas.getContext('2d');
        const zSlider = document.getElementById('z-slider');
        const zDisplay = document.getElementById('z-display');
        const elementSymbol = document.getElementById('element-symbol');
        const totalElectronsDisplay = document.getElementById('total-electrons');
        const coreElectronsDisplay = document.getElementById('core-electrons');
        const zEffDisplay = document.getElementById('z-eff-display');

        const elements = [
            "", "H", "He", "Li", "Be", "B", "C", "N", "O", "F", "Ne",
            "Na", "Mg", "Al", "Si", "P", "S", "Cl", "Ar", "K", "Ca"
        ];

        let Z = parseInt(zSlider.value);
        let time = 0;

        function resize() {
            const container = document.getElementById('container');
            canvas.width = container.clientWidth * window.devicePixelRatio;
            canvas.height = container.clientHeight * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }

        window.addEventListener('resize', resize);
        resize();

        function getShellConfiguration(z) {
            const shells = [0, 0, 0, 0]; 
            let remaining = z;
            shells[0] = Math.min(remaining, 2);
            remaining -= shells[0];
            shells[1] = Math.min(remaining, 8);
            remaining -= shells[1];
            shells[2] = Math.min(remaining, 8);
            remaining -= shells[2];
            shells[3] = Math.min(remaining, 2);
            remaining -= shells[3];
            return shells;
        }

        function calculateZeff(z) {
            const shells = getShellConfiguration(z);
            let valenceShellIdx = 0;
            for(let i = 3; i >= 0; i--) {
                if(shells[i] > 0) {
                    valenceShellIdx = i;
                    break;
                }
            }
            let S = 0;
            const valenceElectrons = shells[valenceShellIdx];
            S += (valenceElectrons - 1) * 0.35;
            if (valenceShellIdx > 0) {
                S += shells[valenceShellIdx - 1] * 0.85;
                for (let i = valenceShellIdx - 2; i >= 0; i--) {
                    S += shells[i] * 1.00;
                }
            }
            return {
                zEff: (z - S).toFixed(2),
                S: S.toFixed(2),
                valenceIdx: valenceShellIdx,
                coreCount: z - valenceElectrons
            };
        }

        function draw() {
            const w = canvas.width / window.devicePixelRatio;
            const h = canvas.height / window.devicePixelRatio;
            const centerX = w / 2;
            const centerY = h / 2;
            const baseRadius = 40;

            ctx.clearRect(0, 0, w, h);

            const shells = getShellConfiguration(Z);
            const data = calculateZeff(Z);
            
            if (data.valenceIdx > 0) {
                const coreRadius = baseRadius + (data.valenceIdx - 1) * 50 + 25;
                const gradient = ctx.createRadialGradient(centerX, centerY, 10, centerX, centerY, coreRadius);
                gradient.addColorStop(0, 'rgba(147, 51, 234, 0.4)');
                gradient.addColorStop(0.6, 'rgba(147, 51, 234, 0.2)');
                gradient.addColorStop(1, 'rgba(147, 51, 234, 0)');
                
                ctx.beginPath();
                ctx.arc(centerX, centerY, coreRadius, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();
                
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.font = '12px Segoe UI';
                ctx.textAlign = 'center';
                ctx.fillText(`가려진 영역 (${data.coreCount}e⁻)`, centerX, centerY + coreRadius - 10);
            }

            shells.forEach((count, i) => {
                if (count === 0) return;
                const radius = baseRadius + i * 50;
                const isValence = (i === data.valenceIdx);
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx.strokeStyle = isValence ? 'rgba(74, 222, 128, 0.4)' : 'rgba(255, 255, 255, 0.1)';
                ctx.lineWidth = isValence ? 2 : 1;
                ctx.setLineDash(isValence ? [] : [5, 5]);
                ctx.stroke();
                ctx.setLineDash([]);

                for (let j = 0; j < count; j++) {
                    const angle = (time * (0.02 / (i + 1))) + (j * (Math.PI * 2 / count));
                    const ex = centerX + Math.cos(angle) * radius;
                    const ey = centerY + Math.sin(angle) * radius;
                    if (isValence) {
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = '#4ade80';
                    }
                    ctx.beginPath();
                    ctx.arc(ex, ey, 5, 0, Math.PI * 2);
                    ctx.fillStyle = isValence ? '#4ade80' : '#60a5fa';
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    if (isValence && j === 0) {
                        ctx.fillStyle = '#fff';
                        ctx.font = 'bold 12px Segoe UI';
                        ctx.fillText('e⁻', ex + 10, ey - 10);
                    }
                }
            });

            ctx.beginPath();
            ctx.arc(centerX, centerY, 15, 0, Math.PI * 2);
            ctx.fillStyle = '#ef4444';
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 12px Segoe UI';
            ctx.textAlign = 'center';
            ctx.fillText(`${Z}+`, centerX, centerY + 5);
            ctx.font = '10px Segoe UI';
            ctx.fillText('핵', centerX, centerY - 20);

            time += 1;
            requestAnimationFrame(draw);
        }

        zSlider.addEventListener('input', (e) => {
            Z = parseInt(e.target.value);
            // Updated to use proper HTML formatting for math symbols
            zDisplay.innerHTML = `<span class="math-symbol">Z</span> = ${Z}`;
            elementSymbol.innerText = elements[Z];
            
            const data = calculateZeff(Z);
            totalElectronsDisplay.innerText = Z;
            coreElectronsDisplay.innerText = data.coreCount;
            zEffDisplay.innerText = `~${data.zEff}`;
        });

        zSlider.dispatchEvent(new Event('input'));
        draw();
    </script>
</body>
</html>
